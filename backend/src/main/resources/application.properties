spring.application.name=applywise
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/applywise;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
applywise.ai.api-key=${OPENAI_API_KEY:}
applywise.ai.model=${AI_MODEL:gpt-4.1-mini}
applywise.ai.url=${AI_URL:https://api.openai.com/v1/chat/completions}
